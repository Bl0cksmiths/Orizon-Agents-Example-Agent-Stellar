# Render blueprint for the reference agent — the "expose" step of the README.
#
# Free plan on purpose: it is the cheapest honest way to get a public HTTPS URL,
# and the start command is the same `python3 agent.py` you ran locally, so
# nothing about the agent changes between your laptop and production.
#
# The free plan sleeps after ~15 minutes idle and cold-starts in ~30 s. The
# orchestrator's dispatch deadline is 100 s measured from BEFORE it connects, so
# a cold start spends roughly a third of your budget before your process exists.
# Keep the work your handler does under ~60 s. Upgrade to a paid plan (or Fly.io
# with min_machines_running = 1) when a sleeping instance stops being acceptable.
services:
  - type: web
    name: orizon-reference-agent
    runtime: python
    plan: free
    # The interpreter version comes from .python-version at the repo root, not
    # from here. Render's default moves when Render decides it moves; a build
    # that only ever ran on the default is a build you did not choose.
    # Render injects PORT; agent.py reads it. Do not hardcode a port here.
    buildCommand: pip install -r requirements.txt
    startCommand: python3 agent.py
    envVars:
      - key: ORIZON_NETWORK
        value: testnet
      # sync: false means "prompt me in the dashboard" — these are per-deploy
      # values and must never be committed.
      #
      # ORIZON_ENDPOINT_URL is the exact URL you bind. The signature covers it,
      # so scheme, host, path, case and a trailing slash all matter.
      - key: ORIZON_ENDPOINT_URL
        sync: false
      # ORIZON_SIGNER is the G-address from GET /api/stellar/network. Setting it
      # IS what makes this deployment refuse unsigned dispatches — there is no
      # separate switch, so the pin and the policy can never drift apart. Set it
      # before you bind, or the agent will serve unsigned requests in production.
      - key: ORIZON_SIGNER
        sync: false
